# Bokk Yoon — déploiement : npx wrangler deploy (voir README)
name = "bokk-yoon"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[vars]
# Mettre "false" dès qu'un fournisseur SMS est branché (SMS_WEBHOOK_URL) : le code OTP ne sera plus renvoyé à l'écran.
DEMO_OTP = "true"
# Numéro(s) du propriétaire (super-admin), séparés par des virgules. Les membres de l'équipe s'ajoutent depuis /admin/.
ADMIN_PHONES = "+221770000000"

[[d1_databases]]
binding = "DB"
database_name = "bokk-yoon-db"
database_id = "REMPLACER_PAR_L_ID_DE_VOTRE_BASE_D1"
